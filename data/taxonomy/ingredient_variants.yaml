# Variant map. Key = base ingredient (a canonical name). Value = more specific canonical
# names that ALSO count as the base ingredient.
# Used in two places:
#   - the stats tool (what "contains X" means), at query time
#   - build_normalized, which stores recipe_ingredient.canonical_base
# Asking for a variant (e.g. "unsalted butter") matches only that name.
# Deliberately NOT listed: peanut butter, coconut milk, garlic powder, red onion.
# Undecided (not listed): pepper / black pepper, flour / all-purpose flour.
butter:
  - unsalted butter
  - salted butter
olive oil:
  - extra-virgin olive oil
  - extra virgin olive oil
sugar:
  - white sugar
  - granulated sugar
salt:
  - kosher salt
  - sea salt
  - table salt
cinnamon:
  - ground cinnamon
milk:
  - whole milk