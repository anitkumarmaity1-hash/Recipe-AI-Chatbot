# What usually changes when the ingredient is removed (general cooking knowledge).
# The chatbot labels this "predicted", never "supported by the dataset".
removal_effects:
  egg: "Eggs bind, help the mixture rise and add moisture and richness. Without them the result is usually denser, more crumbly or less risen unless a substitute takes over those jobs."
  butter: "Butter adds fat, richness and flavor and makes baked goods tender. Without it the result is usually less rich and may taste different or be drier."
  milk: "Milk is mostly liquid with some fat and sugar. Without it the mixture needs another liquid; the result may be less rich and brown less."
  heavy cream: "Cream adds fat and richness and thickens sauces. Without it a sauce is usually thinner and less rich unless another fat or thickener is added."
  sour cream: "Sour cream adds moisture, tang and richness. Without it the result may be drier and less tangy."
  buttermilk: "Buttermilk adds acid and moisture and tenderizes. Without it the crumb may be less tender and the flavor less tangy."
  cream cheese: "Cream cheese adds richness, tang and a firm creamy body. Without it fillings and frostings are usually softer and less tangy."
  all-purpose flour: "Flour gives structure and thickens. Replacing it usually changes the texture a lot: denser, more crumbly or gummier results are common."
  sugar: "Sugar adds sweetness, moisture and tenderness and helps browning. Without it the result is less sweet, paler and may be drier or tougher."
  honey: "Honey adds sweetness, moisture and a distinct flavor. Without it the result may be less sweet and less moist."
  vegetable oil: "Oil adds fat and moisture and keeps baked goods tender. Without it the result may be drier or firmer."
  mayonnaise: "Mayonnaise adds fat, moisture and a little tang. Without it the result may be drier and less rich."