# Ingredient roles, typical substitutes and what removing an ingredient does (Step 11, Task 3).
#
# IMPORTANT: everything in this file is GENERAL COOKING KNOWLEDGE written by hand.
# It is NOT dataset evidence. The chatbot labels it that way, and a substitute listed
# here is only recommended when the recipes in the dataset also support it.
#
# Names must be canonical ingredient names as they appear in the dataset
# (recipe_ingredient.canonical). Check them against your database with:
#     python -m recipebot.tools.substitution --check-taxonomy
# A name that is not in the dataset is reported there; fix it by editing this file.
# The lookup tries the name first, then its forms from ingredient_variants.yaml
# ("unsalted butter" finds the entry for "butter").

# The only role words allowed below (a test checks this).
role_vocabulary:
  - binding        # holds the mixture together
  - leavening      # makes it rise
  - structure      # gives body / shape when baked or set
  - moisture       # keeps the result moist
  - liquid         # the wet base of a batter, sauce or soup
  - fat            # fat content
  - richness       # a rich, creamy mouthfeel
  - sweetness
  - thickening
  - acid
  - flavor
  - seasoning
  - tenderness     # a soft crumb or texture
  - crunch

roles:
